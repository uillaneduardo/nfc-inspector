# Project-wide Gradle settings.
# Build Environment: Gradle 8.7 running on JDK 21 (JVM 21)
# Compilation Target: Java 17 bytecode (sourceCompatibility/targetCompatibility/jvmTarget = 17)

# JVM memory and encoding settings for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX and modular build flags
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

